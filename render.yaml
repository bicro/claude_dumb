databases:
  - name: claudedumb-db
    plan: free
    databaseName: claudedumb
    user: claudedumb

services:
  - type: web
    name: claudedumb
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claudedumb-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://claudedumb.com
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
