  </header>

  <main>
    <!-- LEFT: Vote input + Feed -->
    <section class="panel-feed">
      <div class="feed-top-bar">
        <div class="vote-area" id="vote-area">
          <div class="vote-area-input-row">
            <input type="text" class="comment-input" id="comment-input" placeholder="what's claude doing?" maxlength="120" autocomplete="off">
            <div class="vote-area-attach">
              <div class="screenshot-drop" id="screenshot-drop">
                <input type="file" id="screenshot-input" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
                <span class="screenshot-drop-text" id="screenshot-drop-text">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                  add screenshot
                </span>
              </div>
            </div>
          </div>
          <div class="upload-preview" id="upload-preview" style="display:none">
            <img id="preview-img" alt="Preview">
            <button class="upload-remove" id="upload-remove">&times;</button>
          </div>
          <div class="vote-buttons">
            <button class="vote-btn smart" id="btn-smart">
              <span class="vote-btn-icon">&#9650;</span>
              Smart
            </button>
            <button class="vote-btn dumb" id="btn-dumb">
              <span class="vote-btn-icon">&#9660;</span>
              Dumb
            </button>
          </div>
          <div class="vote-feedback" id="vote-status"></div>
        </div>
        <div class="feed-tabs">
          <button class="feed-tab active" id="tab-newest" data-sort="newest">Newest</button>
          <button class="feed-tab" id="tab-trending" data-sort="trending">Trending</button>
        </div>
      </div>
      <div class="feed-list" id="feed-list"></div>
      <div class="globe-trigger" id="globe-trigger"></div>
      <button class="jump-to-top" id="jump-to-top" title="Back to top"><span class="jump-arrow">&#9650;</span> Back to top</button>
      <!-- Leaderboard: hidden until meaningful data -->
      <div class="leaderboard-section" id="leaderboard-section" style="display:none">
        <button class="leaderboard-toggle" id="leaderboard-toggle">Top Influencers</button>
        <div class="leaderboard-list" id="leaderboard-list" style="display:none"></div>
      </div>
    </section>

    <!-- RIGHT: Stats + Globe -->
    <section class="panel-right" id="panel-right">
      <div class="panel-right-stats">
        <div class="vibes-hero">
          <div class="vibes-hero-label">
            <span class="pulse-dot"></span>
            community vibes
          </div>
          <div class="vibes-hero-status" id="vibes-status">Loading...</div>
          <div class="vibes-hero-count" id="vibes-count"></div>
        </div>

        <div class="tiles-section">
          <div class="tiles-grid" id="vibes-tiles"></div>
          <div class="tiles-axis">
            <span>24h ago</span>
            <span>now</span>
          </div>
        </div>

        <div class="meter">
          <div class="meter-header">
            <span class="meter-val smart" id="count-smart">0</span>
            <span class="meter-label">last hour</span>
            <span class="meter-val dumb" id="count-dumb">0</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill smart" id="meter-smart"></div>
            <div class="meter-fill dumb" id="meter-dumb"></div>
          </div>
        </div>

        <div class="trend-inline">
          <div class="trend-header">
            <span class="trend-title">7-Day Vibes Trend</span>
            <span class="trend-pct" id="trend-pct-inline"></span>
          </div>
          <div class="trend-chart" id="trend-chart-inline"></div>
        </div>
      </div>

      <div class="globe-inline" id="globe-section">
        <div class="globe-wrapper" id="globe-wrapper"></div>
      </div>
    </section>
  </main>

  <!-- Mobile fixed bottom vote bar -->
  <div class="mobile-vote-bar" id="mobile-vote-bar">
    <button class="mobile-vote-btn smart" id="mobile-btn-smart">
      <span class="vote-btn-icon">&#9650;</span> Smart
    </button>
    <button class="mobile-vote-btn dumb" id="mobile-btn-dumb">
      <span class="vote-btn-icon">&#9660;</span> Dumb
    </button>
    <div class="mobile-vote-feedback" id="mobile-vote-status"></div>
  </div>

  <footer class="trend-footer">
    <div class="trend-header">
      <span class="trend-title">7-Day Vibes Trend</span>
      <span class="trend-pct" id="trend-pct"></span>
    </div>
    <div class="trend-chart" id="trend-chart"></div>
  </footer>


  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" style="display:none">
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <img id="lightbox-img" alt="Screenshot">
      <button class="lightbox-close" id="lightbox-close">&times;</button>
    </div>
  </div>

  <script src="//unpkg.com/globe.gl"></script>
  <script src="app.js"></script>
